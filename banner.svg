<style>
.tb{fill:none;stroke:#26364a;stroke-width:2}
.tr{fill:none;stroke:#ffb454;stroke-width:3;stroke-linecap:round;stroke-dasharray:40 420;animation:run 3.2s linear infinite}
@keyframes run{from{stroke-dashoffset:460}to{stroke-dashoffset:0}}
.nm{animation:rise 1.2s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{opacity:0;animation:show 14s linear infinite both}
@keyframes show{0%{opacity:0}1%{opacity:1}24%{opacity:1}26%{opacity:0}100%{opacity:0}}
.ty{transform-box:fill-box;transform-origin:0 50%;animation:type 14s linear infinite both}
@keyframes type{0%{transform:scaleX(0)}9%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.ph0,.ty0{animation-delay:0.0s}.ph1,.ty1{animation-delay:3.5s}.ph2,.ty2{animation-delay:7.0s}.ph3,.ty3{animation-delay:10.5s}
.tr2{stroke:#ffb454;stroke-width:2.5;stroke-dasharray:10 60;animation:run2 2.2s linear infinite}@keyframes run2{to{stroke-dashoffset:-140}}.glow{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.15}}
.clk{animation:scroll 1.6s linear infinite}@keyframes scroll{to{transform:translateX(-80px)}}
@media (prefers-reduced-motion:reduce){.tr,.tr2,.glow,.clk,.nm{animation:none}.ph{animation:none}.ph0{opacity:1}.ty{animation:none}}
</style>
